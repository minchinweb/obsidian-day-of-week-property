name: Release

# Push a tag that exactly matches the version in manifest.json (no "v" prefix),
# e.g. `git tag 0.1.0 && git push --tags`. BRAT installs from the release assets.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        run: test "$GITHUB_REF_NAME" = "$(jq -r .version manifest.json)"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          main.js manifest.json styles.css
          --title "$GITHUB_REF_NAME" --generate-notes
